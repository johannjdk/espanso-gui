name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          project_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "$project_version"
          test "$tag_version" = "$project_version" || {
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version." >&2
            exit 1
          }

      - name: Check Python syntax
        run: python3 -m compileall -q espanso_gui

  debian:
    name: Build Debian package
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/espanso-gui-*-linux-debian-ubuntu.deb
          if-no-files-found: error

  linux-standalone:
    name: Build Linux AppImage and standalone DEB
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libglib2.0-0 libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            wget file binutils

      - name: Build standalone DEB and AppImage
        run: |
          bash scripts/build-deb-standalone.sh
          bash scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-standalone-deb
          path: dist/espanso-gui-*-linux-debian-ubuntu-standalone.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/espanso-gui-*-linux-*.AppImage
          if-no-files-found: error


  arch:
    name: Build Arch Linux package
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package in Arch Linux
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel
              useradd --create-home builder
              chown -R builder:builder /workspace
              su --shell /bin/bash builder --command "cd /workspace && scripts/build-pacman.sh"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/espanso-gui-qt-*-linux-arch.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: Build Fedora RPM package
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package in Fedora
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            fedora:latest \
            bash -c '
              set -euo pipefail
              dnf install -y -q rpm-build python3-devel
              bash scripts/build-rpm.sh
            '

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-package
          path: dist/espanso-gui-*-linux-fedora-rhel.noarch.rpm
          if-no-files-found: error

  macos:
    name: Build macOS DMG (${{ matrix.arch }})
    needs: verify-version
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build disk image
        run: bash scripts/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/espanso-gui-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    name: Build Windows archive (x64)
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable archive
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-archive-x64
          path: dist/espanso-gui-*-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [debian, arch, fedora, macos, windows, linux-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS

      - name: Create release with generated notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-artifacts/*
