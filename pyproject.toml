[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espanso-gui"
version = "1.3.3"
description = "A Qt desktop editor for Espanso match configuration files"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "PyYAML>=6.0",
]

[project.scripts]
espanso-gui = "espanso_gui.app:main"

[tool.setuptools.packages.find]
include = ["espanso_gui*"]
